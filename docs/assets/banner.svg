    <circle cx="80" cy="60" r="6" fill="#f59e0b"/>
    <circle cx="10" cy="120" r="6" fill="#4cc38a"/>
  </g>
  <text x="300" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700" fill="#f4f7fb">RunParity Open</text>
  <text x="330" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#9fb0cc">See what actually ran.</text>
  <text x="330" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#9fb0cc">Separate environment clues from causal proof.</text>
