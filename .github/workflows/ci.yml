name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source, tests, and build
        run: pnpm verify

  package-smoke:
    name: Packed CLI smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Pack the publishable file set
        id: pack
        run: |
          pnpm pack --pack-destination .pack
          shopt -s nullglob
          tarballs=(.pack/*.tgz)
          test "${#tarballs[@]}" -eq 1
          echo "tarball=${tarballs[0]}" >> "$GITHUB_OUTPUT"

      - name: Execute the packed binary
        run: |
          npx --yes --package "${{ steps.pack.outputs.tarball }}" runparity --version
          npx --yes --package "${{ steps.pack.outputs.tarball }}" runparity --help
